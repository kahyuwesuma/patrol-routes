<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Rute Patroli Laut YLBKD/GC</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 15px;
            gap: 15px;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-box svg {
            width: 30px;
            height: 30px;
            stroke: white;
        }

        h1 {
            color: #2d3748;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
        }

        .main-content {
            display: flex;
            gap: 15px;
            flex: 1;
            min-height: 0;
        }

        .map-container {
            flex: 1;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 350px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .sidebar.hidden {
            display: none;
        }

        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: white;
        }

        .stats-card h3 {
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .stat-value {
            font-weight: 700;
            font-size: 16px;
        }

        .points-list {
            margin-top: 20px;
        }

        .points-list h3 {
            color: #2d3748;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .point-item {
            background: #f7fafc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .point-item:hover {
            background: #edf2f7;
            transform: translateX(5px);
        }

        .point-item.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-color: #667eea;
        }

        .point-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .point-number {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .point-name {
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
        }

        .point-coords {
            font-size: 12px;
            color: #718096;
            margin-left: 47px;
        }

        .point-distance {
            font-size: 12px;
            color: #667eea;
            margin-left: 47px;
            margin-top: 5px;
            font-weight: 600;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .legend-title {
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .legend-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .icon-start {
            background: #10b981;
            border: 3px solid white;
            box-shadow: 0 0 0 2px #10b981;
        }

        .icon-waypoint {
            background: #667eea;
            border: 3px solid white;
            box-shadow: 0 0 0 2px #667eea;
        }

        .icon-end {
            background: #ef4444;
            border: 3px solid white;
            box-shadow: 0 0 0 2px #ef4444;
        }

        .legend-line {
            width: 30px;
            height: 3px;
            background: #667eea;
            opacity: 0.6;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 10px;
            padding: 0;
        }

        .leaflet-popup-content {
            margin: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .popup-title {
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .popup-coords {
            color: #718096;
            font-size: 12px;
            margin-bottom: 5px;
        }

        @media print {
            .controls, .sidebar {
                display: none;
            }
            .map-container {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="title-section">
                    <div class="icon-box">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
                        </svg>
                    </div>
                    <div>
                        <h1>Peta Rute Patroli Laut</h1>
                        <div class="subtitle">YLBKD/GC - Kepulauan Derawan</div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn btn-primary" onclick="toggleSidebar()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Info
                    </button>
                    <button class="btn btn-success" onclick="downloadCSV()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        Export CSV
                    </button>
                    <button class="btn btn-primary" onclick="printMap()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                        </svg>
                        Print
                    </button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="map-container">
                <div id="map"></div>
                <div class="legend">
                    <div class="legend-title">Legenda</div>
                    <div class="legend-item">
                        <div class="legend-icon icon-start"></div>
                        <span>Titik Awal</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-icon icon-waypoint"></div>
                        <span>Titik Patroli</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-icon icon-end"></div>
                        <span>Titik Akhir</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-line"></div>
                        <span>Rute Patroli</span>
                    </div>
                </div>
            </div>

            <div class="sidebar" id="sidebar">
                <div class="stats-card">
                    <h3>
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                        Statistik Patroli
                    </h3>
                    <div class="stat-item">
                        <span class="stat-label">Total Titik Patroli:</span>
                        <span class="stat-value" id="totalPoints">12</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Jarak Total Rute:</span>
                        <span class="stat-value" id="totalDistance">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Wilayah Cakupan:</span>
                        <span class="stat-value">Sulawesi Tengah</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Koordinat Pusat:</span>
                        <span class="stat-value" id="centerCoords">-</span>
                    </div>
                </div>

                <div class="points-list">
                    <h3>
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        Daftar Titik Patroli
                    </h3>
                    <div id="pointsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var patrolPoints = [
            { id: 1, lat: 2.261193, lon: 118.540478, name: "Titik Patroli 1" },
            { id: 2, lat: 2.181602, lon: 118.350964, name: "Titik Patroli 2" },
            { id: 3, lat: 2.022407, lon: 118.838482, name: "Titik Patroli 3" },
            { id: 4, lat: 1.783586, lon: 119.041729, name: "Titik Patroli 4" },
            { id: 5, lat: 1.565327, lon: 118.525371, name: "Titik Patroli 5" },
            { id: 6, lat: 1.901628, lon: 118.452587, name: "Titik Patroli 6" },
            { id: 7, lat: 2.296870, lon: 118.133984, name: "Titik Patroli 7" },
            { id: 8, lat: 2.381943, lon: 118.247967, name: "Titik Patroli 8" },
            { id: 9, lat: 2.291381, lon: 118.210888, name: "Titik Patroli 9" },
            { id: 10, lat: 1.856334, lon: 118.058453, name: "Titik Patroli 10" },
            { id: 11, lat: 1.629846, lon: 118.208141, name: "Titik Patroli 11" },
            { id: 12, lat: 1.728681, lon: 118.068066, name: "Titik Patroli 12" }
        ];

        var map, markers = [], routeLine;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function initMap() {
            var centerLat = 0;
            var centerLon = 0;
            for (var i = 0; i < patrolPoints.length; i++) {
                centerLat += patrolPoints[i].lat;
                centerLon += patrolPoints[i].lon;
            }
            centerLat = centerLat / patrolPoints.length;
            centerLon = centerLon / patrolPoints.length;

            map = L.map('map', {
                center: [centerLat, centerLon],
                zoom: 8,
                zoomControl: true
            });

            var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            });

            var satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles © Esri',
                maxZoom: 19
            });

            var topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap',
                maxZoom: 17
            });

            osmLayer.addTo(map);

            var baseMaps = {
                "OpenStreetMap": osmLayer,
                "Satellite": satelliteLayer,
                "Topographic": topoLayer
            };

            L.control.layers(baseMaps).addTo(map);

            var routeCoords = [];
            for (var i = 0; i < patrolPoints.length; i++) {
                routeCoords.push([patrolPoints[i].lat, patrolPoints[i].lon]);
            }
            
            routeLine = L.polyline(routeCoords, {
                color: '#667eea',
                weight: 3,
                opacity: 0.7,
                dashArray: '10, 10'
            }).addTo(map);

            for (var i = 0; i < patrolPoints.length; i++) {
                var point = patrolPoints[i];
                var isStart = i === 0;
                var isEnd = i === patrolPoints.length - 1;
                
                var markerColor = '#667eea';
                if (isStart) markerColor = '#10b981';
                if (isEnd) markerColor = '#ef4444';

                var iconHtml = '<div style="position: relative;"><div style="width: 30px; height: 30px; background: ' + markerColor + '; border: 4px solid white; border-radius: 50%; box-shadow: 0 3px 10px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px;">' + point.id + '</div></div>';

                var icon = L.divIcon({
                    className: 'custom-marker',
                    html: iconHtml,
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                var popupContent = '<div class="popup-title">' + point.name + '</div><div class="popup-coords">Lat: ' + point.lat.toFixed(6) + '°<br>Lon: ' + point.lon.toFixed(6) + '°</div>';
                
                if (i > 0) {
                    var dist = calculateDistance(patrolPoints[i-1].lat, patrolPoints[i-1].lon, point.lat, point.lon).toFixed(2);
                    popupContent += '<div class="popup-coords" style="color: #667eea; font-weight: 600; margin-top: 5px;">Jarak dari titik ' + i + ': ' + dist + ' km</div>';
                }

                var marker = L.marker([point.lat, point.lon], { icon: icon }).addTo(map).bindPopup(popupContent);

                (function(pointId, idx) {
                    marker.on('click', function() {
                        highlightPoint(pointId);
                    });
                })(point.id, i);

                markers.push(marker);
            }

            map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });

            updateStatistics();
        }

        function updateStatistics() {
            var totalDist = 0;
            for (var i = 1; i < patrolPoints.length; i++) {
                totalDist += calculateDistance(patrolPoints[i-1].lat, patrolPoints[i-1].lon, patrolPoints[i].lat, patrolPoints[i].lon);
            }

            var sumLat = 0;
            var sumLon = 0;
            for (var i = 0; i < patrolPoints.length; i++) {
                sumLat += patrolPoints[i].lat;
                sumLon += patrolPoints[i].lon;
            }
            var centerLat = (sumLat / patrolPoints.length).toFixed(4);
            var centerLon = (sumLon / patrolPoints.length).toFixed(4);

            document.getElementById('totalDistance').textContent = totalDist.toFixed(2) + ' km';
            document.getElementById('centerCoords').textContent = centerLat + '°, ' + centerLon + '°';

            renderPointsList();
        }

        function renderPointsList() {
            var container = document.getElementById('pointsList');
            container.innerHTML = '';

            for (var i = 0; i < patrolPoints.length; i++) {
                var point = patrolPoints[i];
                var distance = i > 0 ? calculateDistance(patrolPoints[i-1].lat, patrolPoints[i-1].lon, point.lat, point.lon).toFixed(2) : '0.00';

                var div = document.createElement('div');
                div.className = 'point-item';
                div.id = 'point-' + point.id;
                
                (function(idx, pt) {
                    div.onclick = function() {
                        markers[idx].openPopup();
                        map.setView([pt.lat, pt.lon], 10);
                        highlightPoint(pt.id);
                    };
                })(i, point);

                var distanceHtml = '';
                if (i > 0) {
                    distanceHtml = '<div class="point-distance">↗ ' + distance + ' km dari titik sebelumnya</div>';
                }

                div.innerHTML = '<div class="point-header"><div class="point-number">' + point.id + '</div><div class="point-name">' + point.name + '</div></div><div class="point-coords">' + point.lat.toFixed(6) + '°, ' + point.lon.toFixed(6) + '°</div>' + distanceHtml;

                container.appendChild(div);
            }
        }

        function highlightPoint(id) {
            var items = document.querySelectorAll('.point-item');
            for (var i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
            }
            var element = document.getElementById('point-' + id);
            if (element) {
                element.classList.add('active');
                element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        }

        function downloadCSV() {
            var headers = ['ID', 'Nama', 'Latitude', 'Longitude', 'Jarak dari Titik Sebelumnya (km)'];
            var csv = headers.join(',') + '\n';
            
            for (var i = 0; i < patrolPoints.length; i++) {
                var point = patrolPoints[i];
                var distance = i > 0 ? calculateDistance(patrolPoints[i-1].lat, patrolPoints[i-1].lon, point.lat, point.lon).toFixed(2) : '0.00';
                var row = [point.id, point.name, point.lat, point.lon, distance];
                csv += row.join(',') + '\n';
            }

            var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement('a');
            var url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', 'rute_patroli_ylbkd_gc.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function printMap() {
            window.print();
        }

        window.onload = initMap;
    </script>
</body>
</html>
